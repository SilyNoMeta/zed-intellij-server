id = "intellij-server"
name = "Java & Kotlin (IntelliJ engine)"
version = "0.1.1"
schema_version = 1
authors = ["SilyNoMeta"]
description = "IntelliJ-powered code engine for Java and Kotlin (JetBrains intellij-server backend). Not affiliated with or endorsed by JetBrains."
repository = "https://github.com/SilyNoMeta/zed-intellij-server"

[language_servers.intellij-server]
name = "IntelliJ Server"
languages = ["Java", "Kotlin"]

[debug_adapters.intellij-debugger]

[grammars.java]
repository = "https://github.com/tree-sitter/tree-sitter-java"
commit = "94703d5a6bed02b98e438d7cad1136c01a60ba2c"

[grammars.kotlin]
repository = "https://github.com/fwcd/tree-sitter-kotlin"
commit = "1852ea17b7f60fb3f9d84e0b1555d56b46b39fb1"

# Groovy grammar, used by the Gradle language (languages/gradle) for
# build.gradle highlighting — same bundle as zed-extensions/java.
[grammars.groovy]
repository = "https://github.com/murtaza64/tree-sitter-groovy"
commit = "deb0dcf8c4544f07564060f6e9b9f6e4b0bfc27d"

[[capabilities]]
kind = "download_file"
host = "download.jetbrains.com"
path = ["language-server", "intellij-server", "**"]

[[capabilities]]
kind = "process:exec"
command = "tar"
args = ["**"]
