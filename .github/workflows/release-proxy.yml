name: release-proxy

# Builds the ij-zed-proxy release matrix and attaches binaries (+ sha256)
# to the GitHub Release for tag `proxy-v*`. After a run, update the sha256 in
# extension/proxy-bundles.json from the release assets.
on:
  push:
    tags:
      - "proxy-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to (e.g. proxy-v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, suffix: darwin-aarch64 }
          - { os: macos-13, target: x86_64-apple-darwin, suffix: darwin-x86_64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, suffix: linux-x86_64 }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, suffix: linux-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, suffix: windows-x86_64 }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, suffix: windows-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: rustup target add ${{ matrix.target }}
      - name: Build
        working-directory: proxy
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Stage + checksum (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p out
          cp "proxy/target/${{ matrix.target }}/release/ij-zed-proxy" "out/ij-zed-proxy-${{ matrix.suffix }}"
          shasum -a 256 "out/ij-zed-proxy-${{ matrix.suffix }}" | awk '{print $1}' > "out/ij-zed-proxy-${{ matrix.suffix }}.sha256"
      - name: Stage + checksum (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "proxy/target/${{ matrix.target }}/release/ij-zed-proxy.exe" "out/ij-zed-proxy-${{ matrix.suffix }}"
          (Get-FileHash "out/ij-zed-proxy-${{ matrix.suffix }}" -Algorithm SHA256).Hash.ToLower() | Out-File -NoNewline -Encoding ascii "out/ij-zed-proxy-${{ matrix.suffix }}.sha256"
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "ij-zed-proxy prebuilt binaries (see extension/proxy-bundles.json)."
          gh release upload "$TAG" out/* --clobber
