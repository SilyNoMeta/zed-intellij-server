name: release-proxy

# Builds the ij-zed-proxy release matrix and attaches binaries (+ sha256)
# to the GitHub Release for tag `proxy-v*`. After a run, update the sha256 in
# extension/proxy-bundles.json from the release assets.
on:
  push:
    tags:
      - "proxy-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to (e.g. proxy-v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, suffix: darwin-aarch64, toolchain: zig }
          - { os: macos-13, target: x86_64-apple-darwin, suffix: darwin-x86_64, toolchain: zig }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, suffix: linux-x86_64, toolchain: zig }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, suffix: linux-aarch64, toolchain: zig }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, suffix: windows-x86_64, toolchain: msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, suffix: windows-aarch64, toolchain: msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: goto-bus-stop/setup-zig@v2
        if: matrix.toolchain == 'zig'
      - uses: taiki-e/install-action@v2
        if: matrix.toolchain == 'zig'
        with:
          tool: cargo-zigbuild
      - run: rustup target add ${{ matrix.target }}
      - name: Build (zigbuild)
        if: matrix.toolchain == 'zig'
        working-directory: proxy
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Build (msvc)
        if: matrix.toolchain == 'msvc'
        working-directory: proxy
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage + checksum
        shell: bash
        run: |
          mkdir -p out
          bin="proxy/target/${{ matrix.target }}/release/ij-zed-proxy"
          [ -f "${bin}.exe" ] && bin="${bin}.exe"
          cp "$bin" "out/ij-zed-proxy-${{ matrix.suffix }}"
          f="out/ij-zed-proxy-${{ matrix.suffix }}"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"
          elif command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          else
            powershell -NoProfile -Command "(Get-FileHash '$f' -Algorithm SHA256).Hash.ToLower()" | tr -d '\r' > "$f.sha256"
          fi
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "ij-zed-proxy prebuilt binaries (see extension/proxy-bundles.json)."
          gh release upload "$TAG" out/* --clobber
